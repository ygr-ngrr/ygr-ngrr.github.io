<script>
// ============================================================
//  作品データの読み込みと描画
//  スプレッドシート →「📤 サイトに反映」→ ここで表示
// ============================================================
const WORKS_API_URL = "https://script.google.com/macros/s/AKfycbwcBcuXCJJjp2OBeUq8SJVUkxknUoXEuZWNuaE5Tv5njdNEuU5vgvn26B_XY603u2wd/exec";

// シート → 表示先・小見出しの対応
const SHEET_MAP = [
  { sheet: "現代メイン",         target: "secGendaiMain",  heading: "🌟 メインシリーズ（世界観共通）" },
  { sheet: "現代サブ",           target: "secGendaiSub",   heading: "🌙 別世界のお話" },
  { sheet: "ファンタジーメイン", target: "secFantasyMain", heading: "🌟 メインシリーズ（世界観共通）" },
  { sheet: "ファンタジーサブ",   target: "secFantasySub",  heading: "🌙 別世界のお話" },
  { sheet: "有料販売",           target: "secPaid",        heading: "", paid: true },
];

// ステータス → ラベル色
const STATUS_CLASS = { "完結": "dl-complete", "連載中": "dl-ongoing", "販売中": "dl-selling", "準備中": "dl-preparing", "執筆中": "dl-preparing" };
const LENGTH_CLASS = { "長編": "dl-long", "中編": "dl-mid", "短編": "dl-short" };
const RATING_CLASS = { "R18": "dl-r18", "全年齢": "dl-all" };

// 旧ページのアンカーIDを引き継ぐ（共有済みリンクやguide.htmlからのリンクを切らさないため）
const LEGACY_IDS = {
  "n9554lh": "kusoshunin", "n7872jy": "himaol", "px21226533": "namaiki",
  "n4212jw": "renkinjutsushi", "n7968le": "maounomusume", "RJ01579234": "yuinao-antholo",
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// URLから安定したIDを作る（なろうNコード / pixiv ID / DLsite RJコード）
function workId(work, sheetKey, index) {
  const url = work["掲載先URL（メイン）"] || "";
  let key = "";
  let m = url.match(/syosetu\.com\/(n\w+)\//i);
  if (m) key = m[1].toLowerCase();
  if (!key) { m = url.match(/pixiv\.net.*?id=(\d+)/i); if (m) key = "px" + m[1]; }
  if (!key) { m = url.match(/product_id\/(RJ\d+)/i); if (m) key = m[1]; }
  if (key && LEGACY_IDS[key]) return LEGACY_IDS[key];
  const SHEET_KEYS = { "現代メイン": "gendai-main", "現代サブ": "gendai-sub", "ファンタジーメイン": "fantasy-main", "ファンタジーサブ": "fantasy-sub", "有料販売": "paid" };
  return key || ("w-" + (SHEET_KEYS[sheetKey] || "x") + "-" + (index + 1));
}

// タイトルからカバーの色（gc1〜gc5）を決める。作品を増やしても既存の色は変わらない
function coverClass(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  return "gc" + ((h % 5) + 1);
}

// シェア用の短いタイトル（【〜】が十分長いときはそこまで、『 の前までを使う）
function shortTitle(title) {
  const a = title.indexOf("】");
  if (title.startsWith("【") && a >= 5) return title.slice(0, a + 1);
  const b = title.indexOf("『");
  if (b > 0) return title.slice(0, b).trim();
  return title;
}

// 掲載先リンクの見た目（色クラスと絵文字）
function platformParts(nameOrUrl) {
  const s = (nameOrUrl || "").toLowerCase();
  if (s.includes("pixiv")) return { cls: "pl-pixiv", emoji: "🎨 " };
  if (s.includes("dlsite")) return { cls: "pl-dlsite", emoji: "" };
  if (s.includes("fanza") || s.includes("dmm")) return { cls: "pl-fanza", emoji: "" };
  if (s.includes("novel18") || s.includes("ムーンライト")) return { cls: "pl-moon", emoji: "🌙 " };
  if (s.includes("syosetu") || s.includes("なろう")) return { cls: "pl-narou", emoji: "" };
  return { cls: "", emoji: "" };
}

function buildCard(work, sheetKey, index, isPaid) {
  const title = work["タイトル"] || "";
  const id = workId(work, sheetKey, index);

  // ラベル列
  let labels = "";
  if ((work["ピックアップ"] || "").toUpperCase() === "TRUE") labels += '<span class="d-label dl-badge">⭐ 代表作</span>';
  const st = work["ステータス"] || "";
  if (st) labels += '<span class="d-label ' + (STATUS_CLASS[st] || "dl-complete") + '">' + esc(st) + "</span>";
  const len = work["長さ"] || "";
  if (len) labels += '<span class="d-label ' + (LENGTH_CLASS[len] || "dl-long") + '">' + esc(len) + "</span>";
  const rate = work["レーティング"] || "";
  if (rate) labels += '<span class="d-label ' + (RATING_CLASS[rate] || "dl-all") + '">' + esc(rate) + "</span>";
  if (work["総文字数"]) labels += '<span class="d-label dl-volume">' + esc(work["総文字数"]) + "</span>";

  // カップリング（「×」を含むときだけ🍒を付ける）
  let coupling = "";
  const cp = work["カップリング"] || "";
  if (cp) coupling = '<div class="work-coupling">' + (cp.includes("×") ? "🍒 " : "") + esc(cp) + "</div>";

  const tag = work["ハッシュタグ"] ? '<div class="work-tag">' + esc(work["ハッシュタグ"]) + "</div>" : "";
  const synopsis = work["あらすじ（作品一覧用）"] || work["あらすじ（トップ用）"] || "";

  // 掲載先リンク
  const mainUrl = work["掲載先URL（メイン）"] || "";
  const subUrl = work["掲載先URL（サブ）"] || "";
  const subName = work["掲載先名（サブ）"] || "掲載先";
  let platforms = "";
  if (isPaid && st === "販売中" && mainUrl) {
    const mp = platformParts(mainUrl);
    const mainName = mp.cls === "pl-fanza" ? "FANZA" : "DLsite";
    platforms = '<div class="work-platforms"><div class="work-also-on">🛒 販売ページへ ⇒</div>' +
      '<a href="' + esc(mainUrl) + '" class="platform-link ' + mp.cls + '" target="_blank">' + esc(mainName) + "</a>";
    if (subUrl) {
      const sp = platformParts(subName + subUrl);
      platforms += '<a href="' + esc(subUrl) + '" class="platform-link ' + sp.cls + '" target="_blank">' + esc(subName) + "</a>";
    }
    platforms += "</div>";
  } else if (mainUrl) {
    platforms = '<div class="work-platforms"><a href="' + esc(mainUrl) + '" class="work-read-btn" target="_blank">📖 この作品を読む</a>';
    if (subUrl) {
      const sp = platformParts(subName + subUrl);
      platforms += '<div class="work-also-on">こちらにも掲載：</div>' +
        '<a href="' + esc(subUrl) + '" class="platform-link ' + sp.cls + '" target="_blank">' + sp.emoji + esc(subName) + "</a>";
    }
    platforms += "</div>";
  }

  // イメージソング・あとがき
  let extras = "";
  if (work["イメージソングURL"]) extras += '<a href="' + esc(work["イメージソングURL"]) + '" class="extra-link link-playlist" target="_blank">🎵 イメージソング</a>';
  if (work["あとがきURL"]) extras += '<a href="' + esc(work["あとがきURL"]) + '" class="extra-link link-afterword" target="_blank">📝 あとがき</a>';
  if (extras) extras = '<div class="work-extras">' + extras + "</div>";

  // 掲載年月（「2026/03」形式なら「掲載」を付け、それ以外の文章はそのまま表示）
  let date = "";
  const ym = work["掲載年月"] || "";
  if (ym) date = '<div class="work-date">' + (/^\d{4}\/\d{1,2}$/.test(ym) ? "掲載 " + esc(ym) : esc(ym)) + "</div>";

  return '<div class="work-detail" id="' + esc(id) + '">' +
    '<div class="work-detail-cover ' + coverClass(title) + '">' +
      '<div class="work-detail-labels">' + labels + "</div>" +
      '<div class="work-detail-title">' + esc(title) + "</div>" +
    "</div>" +
    '<div class="work-detail-body">' +
      coupling + tag +
      (synopsis ? '<div class="work-synopsis-full">' + esc(synopsis) + "</div>" : "") +
      platforms + extras + date +
      '<button class="share-btn" onclick="shareWork(\'' + esc(shortTitle(title)).replace(/'/g, "\\'") + '\', \'' + esc(id) + '\')">📤 シェア</button>' +
    "</div></div>";
}

async function loadWorks() {
  try {
    const res = await fetch(WORKS_API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    SHEET_MAP.forEach(({ sheet, target, heading, paid }) => {
      const works = (data.sheets && data.sheets[sheet]) || [];
      const el = document.getElementById(target);
      if (works.length === 0) { el.innerHTML = ""; return; }
      let html = heading ? '<div class="sub-heading">' + heading + "</div>" : "";
      works.forEach((w, i) => { html += buildCard(w, sheet, i, !!paid); });
      el.innerHTML = html;
    });

    document.getElementById("worksLoading").style.display = "none";
    document.getElementById("worksContent").style.display = "";

    // #アンカー付きでアクセスされた場合、描画後にスクロール
    if (location.hash) {
      const t = document.getElementById(location.hash.slice(1));
      if (t) t.scrollIntoView();
    }
  } catch (e) {
    document.getElementById("worksLoading").style.display = "none";
    document.getElementById("worksError").style.display = "";
  }
}
loadWorks();
</script>

<script>
async function shareWork(title, id) {
  const url = 'https://ygr-ngrr.github.io/works-list.html#' + id;
  if (navigator.share) {
    try {
      await navigator.share({
        title: title + ' — 夜霧流るる',
        text: title + ' を読んでみて！',
        url: url
      });
    } catch (err) {}
  } else {
    // PC等で非対応の場合はURLをコピー
    try {
      await navigator.clipboard.writeText(url);
      const btns = document.querySelectorAll('.share-btn');
      event.target.textContent = '✅ コピーしました';
      setTimeout(() => { event.target.textContent = '📤 シェア'; }, 2000);
    } catch (err) {}
  }
}
</script>
